<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуализатор операций над множествами</title>
    <!-- Подключение KaTeX для рендеринга формул -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
*{margin:0;padding:0;box-sizing:border-box;border-radius:0}
:root{--bg:#e9ecf0;--panel:#fff;--panel2:#f4f5f7;--line:#c4cad3;--text:#111827;--muted:#5b6472;--accent:#1d4ed8;--accent-t:#fff;--danger:#b42318}
body.dark-theme{--bg:#0a0e14;--panel:#111827;--panel2:#0d1320;--line:#2b3544;--text:#e5e7eb;--muted:#9ca3af;--accent:#60a5fa;--accent-t:#0a0e14;--danger:#f87171}
html,body{height:100%}
body{font:14px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
.container{height:100vh;display:flex;flex-direction:column;gap:8px;padding:8px}
header{flex:none;display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent)}
.brand{display:flex;align-items:baseline;gap:16px}
header h1{font-size:16px;font-weight:600;letter-spacing:.02em}
.sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.theme-switch{display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:0;color:var(--text);font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
.theme-switch .track{position:relative;width:44px;height:22px;border:1px solid var(--line);background:var(--panel2);transition:background-color .25s,border-color .25s}
.theme-switch .thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--muted);transition:transform .25s ease,background-color .25s}
.theme-switch:hover .track{border-color:var(--accent)}
.theme-switch:focus-visible .track{outline:2px solid var(--accent);outline-offset:2px}
body.dark-theme .theme-switch .track{border-color:var(--accent)}
body.dark-theme .theme-switch .thumb{transform:translateX(22px);background:var(--accent)}
.main-content{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr);gap:8px}
.control-panel{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.section{background:var(--panel);border:1px solid var(--line);padding:14px 16px}
.section h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.input-group{margin-bottom:12px}
.input-group label{display:block;margin-bottom:4px;font-size:12px;color:var(--muted)}
.input-group input,.input-group select{width:100%;padding:8px 10px;font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);outline:none}
.input-group input:focus,.input-group select:focus{border-color:var(--accent)}
.btn{display:block;width:100%;padding:9px 12px;margin-bottom:6px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-t)}
.btn.primary:hover{opacity:.88;color:var(--accent-t)}
.btn.danger{color:var(--danger);border-color:var(--danger);margin:12px 0 0}
.btn.danger:hover{background:var(--danger);color:var(--panel)}
.operations{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.operations .btn{margin:0}
.difference-controls{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.difference-symbol{font-weight:600;color:var(--accent)}
.sets-checkboxes,.sets-list{max-height:150px;overflow-y:auto;border:1px solid var(--line);background:var(--panel2);padding:6px 10px}
.set-checkbox{display:flex;align-items:center;padding:3px 0}
.set-checkbox input{margin-right:8px;accent-color:var(--accent)}
.set-color-indicator{display:inline-block;width:12px;height:12px;margin-right:8px}
.sets-list{padding:0}
.set-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line)}
.set-item:last-child{border-bottom:0}
.set-name{font-weight:700;color:var(--accent)}
.set-elements{color:var(--muted);font-size:12px;font-family:Consolas,"Courier New",monospace}
.delete-set{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:1px 8px;cursor:pointer;font-size:12px}
.delete-set:hover{background:var(--danger);color:var(--panel)}
.visualization-panel{min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr) auto 190px;gap:8px}
.canvas-container{grid-column:1/-1;position:relative;min-height:0;background:var(--panel);border:1px solid var(--line)}
#vennCanvas{display:block;width:100%;height:100%;object-fit:contain}
.canvas-message{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:24px 32px;text-align:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);color:var(--muted);z-index:10}
.canvas-message h3{color:var(--text);margin-bottom:4px;font-size:15px}
.canvas-container:not(:has(canvas[data-has-sets="true"])) .canvas-message{display:block}
.formula-display{grid-column:span 2;display:flex;align-items:center;justify-content:center;min-height:56px;padding:8px 16px;font-size:18px;background:var(--panel);border:1px solid var(--line)}
.relationship-info{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 16px;display:flex;flex-direction:column;justify-content:center}
.relationship-info h4{font-size:14px}
.relationship-info p{font-size:12px;color:var(--muted)}
.result-section,.element-info{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);padding:12px 16px}
.element-info{grid-column:span 2}
.result-section h3,.element-info h4{flex:none;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.result-content,.element-list{flex:1;min-height:0;overflow-y:auto;font-size:13px}
.result-set{font-family:Consolas,"Courier New",monospace;background:var(--panel2);border:1px solid var(--line);padding:6px 10px;margin-top:6px;font-weight:600;color:var(--accent)}
.element-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.element-item span:last-child{color:var(--muted)}
.notification{background:var(--panel);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--accent);padding:12px 18px;margin-bottom:8px;font-size:13px;animation:fadeInOut 4s ease forwards}
.notification.warning{border-left-color:#d97706}
@keyframes fadeInOut{0%{opacity:0}10%,85%{opacity:1}100%{opacity:0}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s;animation-timing-function:ease}
.theme-fade,.theme-fade *{transition:background-color .35s ease,color .35s ease,border-color .35s ease!important}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
.validity{position:absolute;left:12px;bottom:8px;font:12px Consolas,"Courier New",monospace;color:var(--muted)}
.validity.bad{color:var(--danger)}
.legend{display:none;position:absolute;right:12px;top:12px;min-width:140px;max-height:55%;overflow-y:auto;padding:8px 10px;font-size:12px;background:var(--panel);border:1px solid var(--line)}
.lg-row{display:flex;align-items:center;gap:8px;padding:3px 0}
.lg-sw{flex:none;width:16px;height:16px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 25%,transparent)}
.lg-sw.dashed{border-style:dashed}
.lg-e{color:var(--muted);font-size:11px}
.lg-n{margin-left:auto;padding-left:10px;color:var(--muted);font-family:Consolas,"Courier New",monospace}
.zoombar{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line)}
.zoombar button{width:34px;height:30px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.zoombar button:last-child{border-bottom:0;font-size:11px}
.zoombar button:hover{color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);cursor:pointer}
.input-group .chk input{width:auto;padding:0;accent-color:var(--accent)}
@media (max-width:1100px){
.container{height:auto}.main-content{grid-template-columns:1fr}
.visualization-panel{grid-template-rows:none;grid-template-columns:1fr}
.canvas-container{height:60vw;min-height:320px}.formula-display,.element-info{grid-column:auto}.result-section,.element-info{height:180px}}
</style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand"><h1>Визуализатор операций над множествами</h1><span class="sub">Диаграммы Эйлера — Венна</span></div>
            <button class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Тёмная тема"><span>Тёмная тема</span><span class="track"><span class="thumb"></span></span></button>
        </header>

        <div class="main-content">
            <div class="control-panel">
                <div class="section">
                    <h2>Создание множества</h2>
                    <div class="input-group">
                        <label for="setName">Имя множества:</label>
                        <input type="text" id="setName" value="A" maxlength="1" pattern="[A-Za-z]">
                    </div>
                    <div class="input-group">
                        <label for="setElements">Элементы (числа через запятую):</label>
                        <input type="text" id="setElements" placeholder="1, 2, 3">
                    </div>
                    <div class="input-group">
                        <label for="universeInput">Универсум U (необязательно):</label>
                        <input type="text" id="universeInput" placeholder="по умолчанию — объединение множеств">
                        <label class="chk"><input type="checkbox" id="showUniverse"> Показывать границу универсума</label>
                    </div>
                    <button id="addSetBtn" class="btn primary">Добавить множество</button>
                    <button id="randomSetBtn" class="btn secondary">Случайное множество</button>
                </div>

                <div class="section">
                    <h2>Операции</h2>
                    <div class="input-group">
                        <label>Выберите множества для операций:</label>
                        <div id="operationSets" class="sets-checkboxes"></div>
                    </div>

                    <div class="operations">
                        <button id="intersectionBtn" class="btn secondary">Пересечение (∩)</button>
                        <button id="unionBtn" class="btn secondary">Объединение (∪)</button>
                    </div>

                    <div class="input-group" style="margin-top: 15px;">
                        <label>Разность множеств:</label>
                        <div class="difference-controls">
                            <select id="differenceSetA"><option value="">Выберите A</option></select>
                            <span class="difference-symbol">\</span>
                            <select id="differenceSetB"><option value="">Выберите B</option></select>
                        </div>
                        <button id="differenceBtn" class="btn secondary">Вычислить разность</button>
                    </div>

                    <div class="input-group">
                        <label>Симметрическая разность:</label>
                        <div class="difference-controls">
                            <select id="symmetricSetA"><option value="">Выберите A</option></select>
                            <span class="difference-symbol">△</span>
                            <select id="symmetricSetB"><option value="">Выберите B</option></select>
                        </div>
                        <button id="symmetricBtn" class="btn secondary">Вычислить симметрическую</button>
                    </div>

                    <button id="clearBtn" class="btn danger">Очистить все</button>
                </div>

                <div class="section">
                    <h2>Список множеств</h2>
                    <div id="setsList" class="sets-list"></div>
                </div>
            </div>

            <div class="visualization-panel">
                <div class="canvas-container">
                    <canvas id="vennCanvas" width="800" height="600"></canvas>
                <div class="validity" id="validity"></div>
                <div class="legend" id="legend"></div>
                <div class="zoombar"><button type="button" data-zoom="in" title="Приблизить">+</button><button type="button" data-zoom="out" title="Отдалить">−</button><button type="button" data-zoom="reset" title="Сбросить масштаб">1:1</button></div>
                    <div id="canvasMessage" class="canvas-message">
                        <h3>Добро пожаловать! </h3>
                        <p>Создайте множества слева, чтобы построить диаграмму Эйлера</p>
                    </div>
                </div>
                
                <div id="formulaDisplay" class="formula-display"></div>
                <div id="relationshipInfo" class="relationship-info"></div>
                
                <div id="result" class="result-section">
                    <h3>Результат операции:</h3>
                    <div id="resultContent" class="result-content">
                        <p>Выберите операцию для отображения результата</p>
                    </div>
                </div>
                
                <div id="elementInfo" class="element-info">
                    <h4>Информация об элементах:</h4>
                    <div id="elementList" class="element-list"></div>
                </div>
            </div>
        </div>
        
        <div id="notificationContainer" style="position: fixed; top: 80px; right: 20px; z-index: 2000;"></div>
    </div>

    <script>
        class SetVisualizer {
            constructor() {
                this.sets = new Map();
                this.selectedSets = new Set();
                this.showLabels = true;
                this.isDarkTheme = false;
                this.colors = ['#0072B240','#D55E0040','#E69F0040','#CC79A740','#009E7340','#7A4FBF40','#56B4E940','#8C564B40','#6B728040','#B8860B40'];
                this.originalColors = ['#0072B2','#D55E00','#E69F00','#CC79A7','#009E73','#7A4FBF','#56B4E9','#8C564B','#6B7280','#B8860B'];
                this.canvas = document.getElementById('vennCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.circlePositions = new Map();
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.setupCanvas();
                document.getElementById('universeInput').addEventListener('change', () => this.visualizeSets());
                document.getElementById('showUniverse').addEventListener('change', () => this.visualizeSets());
                this.setupTheme();
                this.updateCanvasDataAttribute();
            }

            setupCanvas() {
                this.W = 800; this.H = 600; this.lastK = 0;
                this.view = { s: 1, tx: 0, ty: 0 };
                const cv = this.canvas;
                cv.style.cursor = 'grab';
                cv.addEventListener('wheel', e => {
                    e.preventDefault();
                    const r = cv.getBoundingClientRect();
                    this.zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
                }, { passive: false });
                let drag = null;
                cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
                cv.addEventListener('pointermove', e => {
                    if (!drag) return;
                    this.view.tx += e.clientX - drag.x; this.view.ty += e.clientY - drag.y;
                    drag = { x: e.clientX, y: e.clientY };
                    this.redraw();
                });
                const stop = () => { drag = null; cv.style.cursor = 'grab'; };
                cv.addEventListener('pointerup', stop);
                cv.addEventListener('pointercancel', stop);
                cv.addEventListener('dblclick', () => this.resetView());
                document.querySelectorAll('[data-zoom]').forEach(b => b.addEventListener('click', () => {
                    const z = b.dataset.zoom;
                    if (z === 'reset') this.resetView(); else this.zoomAt(this.W / 2, this.H / 2, z === 'in' ? 1.25 : 0.8);
                }));
                this.resizeCanvas();
                if (window.ResizeObserver) new ResizeObserver(() => {
                    clearTimeout(this.rt);
                    this.rt = setTimeout(() => this.resizeCanvas(), 120);
                }).observe(this.canvas.parentElement);
            }

            resizeCanvas() {
                const box = this.canvas.parentElement;
                const W = Math.max(480, box.clientWidth), H = Math.max(360, box.clientHeight), k = Math.min(3, window.devicePixelRatio || 1);
                if (W === this.W && H === this.H && k === this.lastK) return;
                this.W = W; this.H = H; this.lastK = k;
                this.canvas.width = Math.round(W * k);
                this.canvas.height = Math.round(H * k);
                this.ctx.setTransform(k, 0, 0, k, 0, 0);
                this.visualizeSets();
            }


            setupEventListeners() {
                document.getElementById('addSetBtn').addEventListener('click', () => this.addSet());
                document.getElementById('randomSetBtn').addEventListener('click', () => this.generateRandomSet());
                document.getElementById('intersectionBtn').addEventListener('click', () => this.calculateIntersection());
                document.getElementById('unionBtn').addEventListener('click', () => this.calculateUnion());
                document.getElementById('differenceBtn').addEventListener('click', () => this.calculateDifference());
                document.getElementById('symmetricBtn').addEventListener('click', () => this.calculateSymmetricDifference());
                document.getElementById('clearBtn').addEventListener('click', () => this.clearAll());

                const setElementsInput = document.getElementById('setElements');
                setElementsInput.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9,]/g, '');
                });

                setElementsInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addSet();
                });

                document.getElementById('operationSets').addEventListener('change', () => {
                    this.updateSelectedSets();
                    this.visualizeSets();
                });

                document.querySelector('.theme-switch').addEventListener('click', () => this.toggleTheme());
            }

            setupTheme() {
                if (localStorage.getItem('venn-theme') === 'dark') {
                    this.toggleTheme(false);
                }
            }

            addSet() {
                const name = document.getElementById('setName').value.trim().toUpperCase();
                const elementsInput = document.getElementById('setElements').value.trim();

                if (!name || !elementsInput) {
                    alert('Введите имя множества и элементы (числа через запятую)');
                    return;
                }

                if (!/^[A-Z]$/.test(name)) {
                    alert('Имя множества должно быть буквой A-Z');
                    return;
                }

                if (this.sets.has(name)) {
                    alert(`Множество ${name} уже существует!`);
                    return;
                }

                const rawElements = elementsInput.split(',')
                    .map(el => el.trim())
                    .filter(el => el !== '')
                    .map(Number);

                const uniqueElements = [...new Set(rawElements)];
                const hasDuplicates = rawElements.length !== uniqueElements.length;

                const colorIndex = this.sets.size % this.colors.length;
                this.sets.set(name, {
                    name: name,
                    elements: uniqueElements,
                    color: this.colors[colorIndex],
                    originalColor: this.originalColors[colorIndex]
                });

                this.updateUI();
                document.getElementById('setElements').value = '';
                
                const nextChar = String.fromCharCode(name.charCodeAt(0) + 1);
                if (nextChar <= 'Z') document.getElementById('setName').value = nextChar;

                this.updateCanvasDataAttribute();

                if (hasDuplicates) {
                    this.showNotification(`Дубликаты отсечены. Множество ${name}: {${uniqueElements.join(', ')}}`);
                } else {
                    this.showNotification(`Множество ${name} добавлено`);
                }

                if (this.sets.size >= 4) {
                    this.showNotification(
                        `Внимание! Пересечения 4+ множеств рассчитываются симуляцией графа.`,
                        'warning'
                    );
                }
            }

            generateRandomSet() {
                const name = document.getElementById('setName').value.trim().toUpperCase() || 'A';
                const count = Math.floor(Math.random() * 5) + 2;
                const elements = Array.from({length: count}, () => Math.floor(Math.random() * 12) + 1);
                document.getElementById('setElements').value = elements.join(', ');
                this.addSet();
            }

            updateUI() {
                this.updateSetsList();
                this.updateOperationSets();
                this.updateDifferenceControls();
                this.updateSelectedSets();
                this.visualizeSets();
                this.updateRelationshipInfo();
                this.updateElementInfo();
            }

            updateSetsList() {
                const setsList = document.getElementById('setsList');
                setsList.innerHTML = '';
                this.sets.forEach((setData, setName) => {
                    const setItem = document.createElement('div');
                    setItem.className = 'set-item';
                    setItem.innerHTML = `
                        <div>
                            <span class="set-name">${setData.name}</span>
                            <div class="set-elements">{${setData.elements.join(', ')}}</div>
                        </div>
                        <button class="delete-set" onclick="visualizer.deleteSet('${setName}')">×</button>
                    `;
                    setsList.appendChild(setItem);
                });
            }

            updateOperationSets() {
                const operationSets = document.getElementById('operationSets');
                operationSets.innerHTML = '';
                this.sets.forEach((setData, setName) => {
                    const checkbox = document.createElement('div');
                    checkbox.className = 'set-checkbox';
                    checkbox.innerHTML = `
                        <input type="checkbox" id="set-${setName}" value="${setName}" ${this.selectedSets.has(setName) ? 'checked' : ''}>
                        <label for="set-${setName}">
                            <span class="set-color-indicator" style="background: ${setData.originalColor}"></span>
                            ${setData.name} {${setData.elements.join(', ')}}
                        </label>
                    `;
                    operationSets.appendChild(checkbox);
                });
            }

            updateDifferenceControls() {
                const updateSelect = (id) => {
                    const select = document.getElementById(id);
                    const val = select.value;
                    select.innerHTML = '<option value="">Выберите множество</option>';
                    this.sets.forEach((data, name) => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = `${name} {${data.elements.join(', ')}}`;
                        if (name === val) opt.selected = true;
                        select.appendChild(opt);
                    });
                };
                ['differenceSetA', 'differenceSetB', 'symmetricSetA', 'symmetricSetB'].forEach(updateSelect);
            }

            updateSelectedSets() {
                this.selectedSets.clear();
                document.querySelectorAll('#operationSets input[type="checkbox"]:checked')
                    .forEach(cb => this.selectedSets.add(cb.value));
            }

            updateCanvasDataAttribute() {
                this.canvas.setAttribute('data-has-sets', this.sets.size > 0);
            }

            deleteSet(setName) {
                this.sets.delete(setName);
                this.selectedSets.delete(setName);
                this.circlePositions.delete(setName);
                this.updateUI();
                this.clearResult();
                this.updateCanvasDataAttribute();
            }

            // УНИВЕРСАЛЬНЫЙ СИЛОВОЙ МЕТОД РАСРАСПОЛОЖЕНИЯ КРУГОВ (FORCE-DIRECTED LAYOUT)
                        legacyCirclePositions() {

                        for (let t = 0; t < 48; t++) {
                            const a = t / 48 * 6.2832, u = p.rx * Math.cos(a), v = p.ry * Math.sin(a);
                            pts.push([p.x + u * c - v * sn, p.y + u * sn + v * c]);
                        }
                    }
                });
                if (!pts.length) return this.frame();
                const out = this.model ? this.model.outside.length : 0, mg = 36 + (out ? 60 + 10 * Math.sqrt(out) : 0);
                const x0 = Math.max(6, Math.min(...pts.map(q => q[0])) - mg), y0 = Math.max(6, Math.min(...pts.map(q => q[1])) - mg);
                const x1 = Math.min(this.W - 6, Math.max(...pts.map(q => q[0])) + mg), y1 = Math.min(this.H - 6, Math.max(...pts.map(q => q[1])) + mg);
                return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
            }

            ubox() { return this.uBox || this.frame(); }

            showFrame() {
                const t = document.getElementById('showUniverse');
                return !!((t && t.checked) || (this.model && this.model.outside.length > 0));
            }

            hexA(hex, a) {
                const n = parseInt(hex.slice(1), 16);
                return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
            }

            drawCircle(setData, highlight = false) {
                const pos = this.circlePositions.get(setData.name);
                if (!pos || pos.hidden) return;
                const ctx = this.ctx, c = setData.originalColor, dark = this.isDarkTheme;
                const trace = (g) => {
                    ctx.beginPath();
                    if (pos.isEllipse) ctx.ellipse(pos.x, pos.y, pos.rx + g, pos.ry + g, pos.rotation, 0, 2 * Math.PI);
                    else ctx.arc(pos.x, pos.y, pos.r + g, 0, 2 * Math.PI);
                };
                const edge = pos.isEllipse ? Math.max(pos.rx, pos.ry) : pos.r;
                const grad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, edge);
                grad.addColorStop(0, this.hexA(c, dark ? 0.10 : 0.05));
                grad.addColorStop(1, this.hexA(c, highlight ? (dark ? 0.42 : 0.34) : (dark ? 0.30 : 0.20)));
                if (highlight && !pos.disks && !pos.derived) {
                    trace(6);
                    ctx.strokeStyle = this.hexA(c, 0.4);
                    ctx.lineWidth = (1) / this.view.s;
                    ctx.stroke();
                }
                if (pos.derived) this.drawDerived(pos, c, highlight);
                else if (pos.disks) this.drawUnion(pos, c, highlight);
                else {
                    trace(0);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.strokeStyle = c;
                    ctx.lineWidth = (highlight ? 2.5 : 1.5) / this.view.s;
                    ctx.stroke();
                }
            }

            computeElementLayout() {
                const sets = Array.from(this.sets.values()).filter(s => !(this.derived && this.derived.has(s.name)));
                const names = sets.map(s => s.name).sort();
                const shapes = names.map(n => this.circlePositions.get(n));
                const G = 4, cols = Math.ceil(this.W / G), rows = Math.ceil(this.H / G), N = cols * rows;
                const inside = (p, x, y) => {
                    if (p.field) return p.field(x, y) < 0;
                    const dx = x - p.x, dy = y - p.y;
                    if (!p.isEllipse) return dx * dx + dy * dy <= p.r * p.r;
                    const c = Math.cos(p.rotation), s = Math.sin(p.rotation);
                    const u = dx * c + dy * s, v = -dx * s + dy * c;
                    return (u * u) / (p.rx * p.rx) + (v * v) / (p.ry * p.ry) <= 1;
                };
                // 1. Карта зон: каждая клетка поля получает метку «в каких множествах лежит» (A, B, AB, ...)
                const lab = new Array(N);
                for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
                    let k = '';
                    for (let t = 0; t < names.length; t++) if (shapes[t] && inside(shapes[t], i * G + G / 2, j * G + G / 2)) k += names[t];
                    lab[j * cols + i] = this.inFrame(i * G + G / 2, j * G + G / 2) ? k : null;
                }
                // 2. Расстояние от каждой клетки до границы её зоны
                const d = new Float32Array(N);
                for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
                    const n = j * cols + i, k = lab[n];
                    const edge = i === 0 || j === 0 || i === cols - 1 || j === rows - 1 ||
                        lab[n - 1] !== k || lab[n + 1] !== k || lab[n - cols] !== k || lab[n + cols] !== k;
                    d[n] = edge ? 0 : 1e9;
                }
                for (let j = 1; j < rows - 1; j++) for (let i = 1; i < cols - 1; i++) {
                    const n = j * cols + i;
                    d[n] = Math.min(d[n], d[n - 1] + 1, d[n - cols] + 1, d[n - cols - 1] + 1.4, d[n - cols + 1] + 1.4);
                }
                for (let j = rows - 2; j > 0; j--) for (let i = cols - 2; i > 0; i--) {
                    const n = j * cols + i;
                    d[n] = Math.min(d[n], d[n + 1] + 1, d[n + cols] + 1, d[n + cols + 1] + 1.4, d[n + cols - 1] + 1.4);
                }
                // 3. Центр каждой зоны: самая «глубокая» точка внутри неё
                const zones = new Map();
                for (let n = 0; n < N; n++) {
                    const k = lab[n];
                    if (k === null) continue;
                    let z = zones.get(k);
                    if (!z) zones.set(k, z = { best: -1, bn: 0, cells: 0 });
                    z.cells++;
                    if (d[n] > z.best) { z.best = d[n]; z.bn = n; }
                }
                zones.forEach(z => {
                    z.ax = (z.bn % cols) * G + G / 2;
                    z.ay = Math.floor(z.bn / cols) * G + G / 2;
                    z.depth = z.best * G;
                });
                // 4. Элементы по зонам, начальные позиции по спирали вокруг центра зоны
                const groups = new Map();
                new Set([...sets.flatMap(s => s.elements), ...(this.model ? this.model.outside : [])]).forEach(el => {
                    const k = sets.filter(s => s.elements.includes(el)).map(s => s.name).sort().join('');
                    if (!groups.has(k)) groups.set(k, []);
                    groups.get(k).push(el);
                });
                const pts = [];
                groups.forEach((els, k) => {
                    const z = zones.get(k);
                    if (!z) {
                        const f = this.getRegionCoordinates(k);
                        if (!f) return;
                        els.forEach((el, m) => pts.push({ el, fixed: true, fs: 13, x: f.x + (m % 3 - 1) * 16, y: f.y + (Math.floor(m / 3) - 0.5) * 15 }));
                        return;
                    }
                    const sep = Math.max(10, Math.min(22, Math.sqrt(z.cells * G * G / els.length) * 0.8));
                    els.forEach((el, m) => {
                        const a = m * 2.4, r = sep * 0.6 * Math.sqrt(m);
                        pts.push({ el, k, z, sep, fs: sep < 14 ? 10 : sep < 18 ? 12 : 13, margin: Math.min(7, z.depth * 0.5),
                                   x: z.ax + r * Math.cos(a), y: z.ay + r * Math.sin(a) });
                    });
                });
                const ok = (p, x, y) => {
                    const i = Math.floor(x / G), j = Math.floor(y / G);
                    if (i < 0 || j < 0 || i >= cols || j >= rows) return false;
                    const n = j * cols + i;
                    return lab[n] === p.k && d[n] * G >= p.margin;
                };
                const mv = pts.filter(p => !p.fixed);
                mv.forEach(p => {
                    for (let t = 0; t < 8 && !ok(p, p.x, p.y); t++) { p.x = p.z.ax + (p.x - p.z.ax) * 0.6; p.y = p.z.ay + (p.y - p.z.ay) * 0.6; }
                    if (!ok(p, p.x, p.y)) { p.x = p.z.ax; p.y = p.z.ay; }
                });
                // 5. Пружины: притяжение к центру своей зоны, отталкивание друг от друга, границы зоны не пересекаются
                for (let it = 0; it < 120; it++) {
                    mv.forEach((p, a) => {
                        let fx = (p.z.ax - p.x) * 0.04, fy = (p.z.ay - p.y) * 0.04;
                        mv.forEach((q, b) => {
                            if (a === b) return;
                            let dx = p.x - q.x, dy = p.y - q.y, dist = Math.hypot(dx, dy);
                            const m = Math.min(p.sep, q.sep);
                            if (dist < m) {
                                if (dist < 0.01) { dx = Math.cos(a + 1); dy = Math.sin(a + 1); dist = 1; }
                                const f = (m - dist) * 0.35 / dist;
                                fx += dx * f; fy += dy * f;
                            }
                        });
                        for (const s of [1, 0.5, 0.25]) {
                            if (ok(p, p.x + fx * s, p.y + fy * s)) { p.x += fx * s; p.y += fy * s; break; }
                        }
                    });
                }
                return pts;
            }

            drawElementsOnCanvas() {
                if (!this.showLabels || this.sets.size === 0) return;
                const ctx = this.ctx;
                ctx.fillStyle = this.isDarkTheme ? '#f3f4f6' : '#111827';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                (this.elCache && this.elCache.key === this.layoutKey ? this.elCache.pts : (this.elCache = { key: this.layoutKey, pts: this.computeElementLayout() }).pts).forEach(p => {
                    ctx.font = `600 ${p.fs}px "Segoe UI", Roboto, Arial, sans-serif`;
                    ctx.fillText(String(p.el), p.x, p.y);
                });
            }


            getRegionCoordinates(regionKey) {
                const setsInRegion = regionKey.split('');
                const positions = setsInRegion.map(name => this.circlePositions.get(name)).filter(Boolean);

                if (positions.length === 0) return null;

                const avgX = positions.reduce((sum, p) => sum + p.x, 0) / positions.length;
                const avgY = positions.reduce((sum, p) => sum + p.y, 0) / positions.length;

                return { x: avgX, y: avgY };
            }

            visualizeSets() {
                this.clearCanvas();
                if (this.sets.size === 0) return;

                this.calculateCirclePositions();

                this.sets.forEach(setData => {
                    const isSelected = this.selectedSets.has(setData.name);
                    this.drawCircle(setData, isSelected);
                });

                this.drawHatch();
                this.drawElementsOnCanvas();
                this.drawLabels();
            }

            clearCanvas() {
                const c = this.ctx, d = this.isDarkTheme;
                c.setTransform(this.lastK, 0, 0, this.lastK, 0, 0);
                c.clearRect(0, 0, this.W, this.H);
                c.fillStyle = d ? '#111827' : '#ffffff';
                c.fillRect(0, 0, this.W, this.H);
                const vw = this.view, kk = this.lastK;
                c.setTransform(kk * vw.s, 0, 0, kk * vw.s, kk * vw.tx, kk * vw.ty);
                const lx0 = -vw.tx / vw.s, lx1 = (this.W - vw.tx) / vw.s, ly0 = -vw.ty / vw.s, ly1 = (this.H - vw.ty) / vw.s;
                c.strokeStyle = d ? '#1b2434' : '#eef0f3';
                c.lineWidth = (1) / this.view.s;
                c.beginPath();
                for (let x = Math.ceil((lx0 - this.W / 2) / 40) * 40 + this.W / 2; x <= lx1; x += 40) { c.moveTo(x, ly0); c.lineTo(x, ly1); }
                for (let y = Math.ceil((ly0 - this.H / 2) / 40) * 40 + this.H / 2; y <= ly1; y += 40) { c.moveTo(lx0, y); c.lineTo(lx1, y); }
                c.stroke();
                const F = this.ubox(), v = document.getElementById('validity');
                if (v) v.textContent = '';
                this.updateLegend();
                if (this.showFrame()) {
                c.strokeStyle = d ? '#4b5563' : '#aab1bc';
                c.lineWidth = (1) / this.view.s;
                c.setLineDash([8 / vw.s, 6 / vw.s]);
                c.strokeRect(F.x, F.y, F.w, F.h);
                c.setLineDash([]);
                c.fillStyle = d ? '#9ca3af' : '#374151';
                c.font = '700 14px "Segoe UI", Roboto, Arial, sans-serif';
                c.textAlign = 'left';
                c.textBaseline = 'top';
                c.fillText('U', F.x + 8, F.y + 6);
                }
            }

            calculateIntersection() {
                if (this.selectedSets.size < 2) {
                    alert('Выберите хотя бы 2 множества');
                    return;
                }

                const selectedArray = Array.from(this.selectedSets).map(name => this.sets.get(name));
                let intersection = new Set(selectedArray[0].elements);

                for (let i = 1; i < selectedArray.length; i++) {
                    intersection = new Set([...intersection].filter(x => selectedArray[i].elements.includes(x)));
                }

                this.displayResult(`Пересечение: ${selectedArray.map(s => s.name).join(' ∩ ')}`, intersection);
                this.updateFormula(selectedArray.map(s => s.name).join(' \\cap '));
            }

            calculateUnion() {
                if (this.selectedSets.size === 0) {
                    alert('Выберите множества');
                    return;
                }

                const selectedArray = Array.from(this.selectedSets).map(name => this.sets.get(name));
                const union = new Set();
                selectedArray.forEach(set => set.elements.forEach(el => union.add(el)));

                this.displayResult(`Объединение: ${selectedArray.map(s => s.name).join(' ∪ ')}`, union);
                this.updateFormula(selectedArray.map(s => s.name).join(' \\cup '));
            }

            calculateDifference() {
                const setA = document.getElementById('differenceSetA').value;
                const setB = document.getElementById('differenceSetB').value;

                if (!setA || !setB) {
                    alert('Выберите два множества');
                    return;
                }

                const dataA = this.sets.get(setA);
                const dataB = this.sets.get(setB);
                const difference = new Set(dataA.elements.filter(x => !dataB.elements.includes(x)));

                this.displayResult(`Разность: ${setA} \\ ${setB}`, difference);
                this.updateFormula(`${setA} \\setminus ${setB}`);
            }

            calculateSymmetricDifference() {
                const setA = document.getElementById('symmetricSetA').value;
                const setB = document.getElementById('symmetricSetB').value;

                if (!setA || !setB) {
                    alert('Выберите два множества');
                    return;
                }

                const dataA = this.sets.get(setA);
                const dataB = this.sets.get(setB);

                const diffAB = dataA.elements.filter(x => !dataB.elements.includes(x));
                const diffBA = dataB.elements.filter(x => !dataA.elements.includes(x));
                const symDiff = new Set([...diffAB, ...diffBA]);

                this.displayResult(`Симметрическая разность: ${setA} △ ${setB}`, symDiff);
                this.updateFormula(`${setA} \\triangle ${setB}`);
            }

            displayResult(title, resultSet) {
                const resultContent = document.getElementById('resultContent');
                const elements = Array.from(resultSet);
                resultContent.innerHTML = `
                    <h4>${title}</h4>
                    <div class="result-set">{ ${elements.join(', ') || '∅'} }</div>
                    <p style="margin-top: 8px;"><strong>Мощность множества:</strong> ${resultSet.size}</p>
                `;
            }

            updateFormula(latex) {
                const formulaDisplay = document.getElementById('formulaDisplay');
                formulaDisplay.innerHTML = `\\(${latex}\\)`;
                if (typeof katex !== 'undefined') {
                    katex.render(latex, formulaDisplay, { throwOnError: false, displayMode: true });
                }
            }

            updateRelationshipInfo() {
                const relationshipInfo = document.getElementById('relationshipInfo');
                if (this.sets.size < 2) {
                    relationshipInfo.innerHTML = '';
                    return;
                }

                const setsArray = Array.from(this.sets.values());
                if (this.sets.size === 2) {
                    const [A, B] = setsArray;
                    const inter = this.getIntersection(A, B);
                    const isAsubB = this.isSubset(A, B);
                    const isBsubA = this.isSubset(B, A);

                    if (inter.size === 0) {
                        relationshipInfo.innerHTML = `<h4>${A.name} ∩ ${B.name} = ∅</h4><p>Множества не имеют общих элементов</p>`;
                    } else if (isAsubB && isBsubA) {
                        relationshipInfo.innerHTML = `<h4>${A.name} = ${B.name}</h4><p>Множества полностью равны</p>`;
                    } else if (isAsubB) {
                        relationshipInfo.innerHTML = `<h4>${A.name} ⊆ ${B.name}</h4><p>${A.name} целиком лежит внутри ${B.name}</p>`;
                    } else if (isBsubA) {
                        relationshipInfo.innerHTML = `<h4>${B.name} ⊆ ${A.name}</h4><p>${B.name} целиком лежит внутри ${A.name}</p>`;
                    } else {
                        relationshipInfo.innerHTML = `<h4>${A.name} ∩ ${B.name} ≠ ∅</h4><p>Множества имеют общие элементы</p>`;
                    }
                } else {
                    relationshipInfo.innerHTML = `<h4>Создано множеств: ${this.sets.size}</h4>`;
                }
            }

            updateElementInfo() {
                const elementList = document.getElementById('elementList');
                elementList.innerHTML = '';
                const allElements = new Map();

                this.sets.forEach(setData => {
                    setData.elements.forEach(element => {
                        if (!allElements.has(element)) allElements.set(element, []);
                        allElements.get(element).push(setData.name);
                    });
                });

                allElements.forEach((sets, element) => {
                    const item = document.createElement('div');
                    item.className = 'element-item';
                    item.innerHTML = `<span><strong>${element}</strong></span><span>В множествах: ${sets.join(', ')}</span>`;
                    elementList.appendChild(item);
                });
            }

            toggleTheme(animate = true) {
                const apply = () => {
                    this.isDarkTheme = !this.isDarkTheme;
                    document.body.classList.toggle('dark-theme', this.isDarkTheme);
                    document.querySelector('.theme-switch').setAttribute('aria-checked', String(this.isDarkTheme));
                    localStorage.setItem('venn-theme', this.isDarkTheme ? 'dark' : 'light');
                    this.visualizeSets();
                };
                const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (animate && !calm && document.startViewTransition) {
                    document.startViewTransition(apply);
                } else if (animate && !calm) {
                    document.body.classList.add('theme-fade');
                    apply();
                    setTimeout(() => document.body.classList.remove('theme-fade'), 400);
                } else {
                    apply();
                }
            }

            showNotification(message, type = 'info') {
                const container = document.getElementById('notificationContainer');
                const notification = document.createElement('div');
                notification.className = `notification ${type === 'warning' ? 'warning' : ''}`;
                notification.textContent = message;
                container.appendChild(notification);
                setTimeout(() => notification.remove(), 4000);
            }

            clearResult() {
                document.getElementById('resultContent').innerHTML = '<p>Выберите операцию для отображения результата</p>';
                document.getElementById('formulaDisplay').innerHTML = '';
            }

            clearAll() {
                if (confirm('Очистить все множества?')) {
                    this.sets.clear();
                    this.selectedSets.clear();
                    this.circlePositions.clear();
                    this.updateUI();
                    this.clearResult();
                    this.updateCanvasDataAttribute();
                    document.getElementById('setName').value = 'A';
                    document.getElementById('setElements').value = '';
                }
            }
        }

        const visualizer = new SetVisualizer();
    </script>
</body>
</html>
